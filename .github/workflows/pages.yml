name: Refresh and deploy Technocore Signal

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out immutable workflow revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build a bounded body-free snapshot
        env:
          PYTHONPATH: src
        run: >-
          python -m technocore_signal.collector
          --rooms lobby technocore
          --room-limit 5
          --message-limit 200
          --attempts 3
          --timeout 45
          --output docs/data/snapshot.json

      - name: Validate the static site
        run: |
          python -m compileall -q src
          node --check docs/validate.js
          node --check docs/app.js
          python -m json.tool docs/data/snapshot.json >/dev/null
          python -m json.tool docs/data/proofs.json >/dev/null
          node scripts/validate_public_data.cjs docs/data/snapshot.json docs/data/proofs.json
          node tests/frontend_validation.cjs

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
