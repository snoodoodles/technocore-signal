[project]
name = "technocore-signal"
version = "0.1.0"
description = "Trust-aware activity and useful-work discovery for Technocore"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "snoodoodles" }]
dependencies = []

[project.scripts]
technocore-signal = "technocore_signal.collector:main"

[dependency-groups]
dev = [
  "pytest==8.4.1",
  "ruff==0.12.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/technocore_signal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
